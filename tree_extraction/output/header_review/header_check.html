<title>Header Check</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one screen, no page scroll — top bar, table viewport, reading panel, fixed action bar */
:root {
  --bg: #f6f7f5; --surface: #ffffff; --fg: #1d2420; --muted: #5d6862; --line: #d8ddd8;
  --accent: #23614a; --right: #1f7a4d; --wrong: #b23a2e; --focus: #2b6cb0;
  --r-title: #efe3c4; --r-group: #d7e6f5; --r-column: #cfeedd; --r-specification: #f3d7ea;
  --r-joined: #e6dcf6; --r-row_label: #fde2c8; --r-value: #f6efb8; --r-footnote: #e4e4e4;
  --r-data: #ffffff; --r-none: #f9d5d0; --r-section: #c9ecee; --r-pre: #eeeeee; --r-empty: #f3f4f2;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141816; --surface: #1c211e; --fg: #e3e8e4; --muted: #9aa59f; --line: #333b36;
  --accent: #6cc39b; --right: #4fbf86; --wrong: #ef7a6c; --focus: #7fb0f0;
  --r-title: #4a3f22; --r-group: #22374d; --r-column: #1f4433; --r-specification: #4a2a40;
  --r-joined: #3a2f52; --r-row_label: #4f3720; --r-value: #4a4520; --r-footnote: #333333;
  --r-data: #1c211e; --r-none: #5a2a25; --r-section: #1d4a4d; --r-pre: #2a2a2a; --r-empty: #222724;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141816; --surface: #1c211e; --fg: #e3e8e4; --muted: #9aa59f; --line: #333b36;
  --accent: #6cc39b; --right: #4fbf86; --wrong: #ef7a6c; --focus: #7fb0f0;
  --r-title: #4a3f22; --r-group: #22374d; --r-column: #1f4433; --r-specification: #4a2a40;
  --r-joined: #3a2f52; --r-row_label: #4f3720; --r-value: #4a4520; --r-footnote: #333333;
  --r-data: #1c211e; --r-none: #5a2a25; --r-section: #1d4a4d; --r-pre: #2a2a2a; --r-empty: #222724;
  color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font); overflow: hidden; }
.app { height: 100%; display: flex; flex-direction: column; padding-inline: 16px; box-sizing: border-box; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; padding-block: 12px 8px; border-bottom: 1px solid var(--line); }
h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .01em; }
.where { font-family: var(--mono); font-size: 13px; }
.where b { font-weight: 500; }
.progress { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
.pill { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 10px; border: 1px solid currentColor; }
.pill.right { color: var(--right); } .pill.wrong { color: var(--wrong); } .pill.dev { color: var(--muted); font-weight: 500; } .pill.changed { color: var(--focus); }
.bar-fill { flex-basis: 100%; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar-fill i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; padding-block: 8px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line); display: inline-block; }
.view { flex: 1 1 auto; min-height: 0; overflow: auto; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; }
table.grid { border-collapse: collapse; font-size: 13px; }
.grid td, .grid th { border: 1px solid var(--line); padding: 4px 7px; vertical-align: top; max-width: 260px; }
.grid th { font: 500 11px var(--mono); color: var(--muted); background: var(--bg); position: sticky; left: 0; text-align: right; white-space: nowrap; }
.grid tr.first-body th { color: var(--accent); }
.grid tr.first-body td { border-top: 3px solid var(--accent); }
.role-title { background: var(--r-title); } .role-group { background: var(--r-group); }
.role-column { background: var(--r-column); } .role-specification { background: var(--r-specification); }
.role-joined { background: var(--r-joined); } .role-row_label { background: var(--r-row_label); }
.role-value { background: var(--r-value); } .role-footnote { background: var(--r-footnote); }
.role-data { background: var(--r-data); color: var(--muted); } .role-none { background: var(--r-none); }
.role-pre { background: var(--r-pre); } .role-section { background: var(--r-section); } .role-empty { background: var(--r-empty); }
.reading { flex: 0 1 34%; min-height: 0; overflow: auto; margin-top: 10px; }
.reading h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
table.cols { border-collapse: collapse; width: 100%; font-size: 13px; }
.cols td { padding: 3px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.cols td.n { font: 12px var(--mono); color: var(--muted); width: 3em; font-variant-numeric: tabular-nums; }
.cols td.g { color: var(--muted); }
.cols td.nm { font-weight: 500; }
.cols td.d { font-family: var(--mono); font-size: 12px; }
.cols .missing { color: var(--wrong); font-style: italic; font-weight: 400; }
footer { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding-block: 10px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); margin-top: 10px; }
button { font: 600 14px var(--font); border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 9px 16px; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button.right { background: var(--right); border-color: var(--right); color: #fff; }
button.wrong { background: var(--wrong); border-color: var(--wrong); color: #fff; }
button.ghost { font-weight: 500; padding: 9px 12px; }
kbd { font: 11px var(--mono); opacity: .8; margin-left: 6px; }
input#note { flex: 1 1 220px; min-width: 0; font: 14px var(--font); padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
select#jump { font: 13px var(--font); padding: 7px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); max-width: 100%; }
.status { font-size: 12px; color: var(--muted); flex-basis: 100%; min-height: 1.2em; }
.status.err { color: var(--wrong); }
.prev { font-size: 13px; color: var(--muted); padding-block: 6px 0; }
.prev b { font-weight: 600; } .prev .wrong { color: var(--wrong); } .prev .right { color: var(--right); }
.sections { font-size: 13px; padding-block: 4px 0; }
@media (prefers-reduced-motion: reduce) { .bar-fill i { transition: none; } }
@media (max-width: 600px) { .reading { flex-basis: 40%; } button { padding: 8px 12px; } }
</style>

<div class="app">
  <header>
    <h1>Header Check</h1>
    <span class="where" id="where"></span>
    <span id="verdict"></span>
    <span class="progress" id="progress">loading answers…</span>
    <div class="bar-fill"><i id="fill"></i></div>
  </header>
  <div class="prev" id="prev-round" hidden></div>
  <div class="legend" id="legend"></div>
  <div class="view"><table class="grid" id="grid"></table></div>
  <section class="reading">
    <h2>What the reader decided, per column</h2>
    <div class="sections" id="sections" hidden></div>
    <table class="cols" id="cols"></table>
  </section>
  <footer>
    <button class="ghost" id="prev" title="Previous table (←)">←</button>
    <button class="wrong" id="btn-wrong">✗ Wrong<kbd>N</kbd></button>
    <button class="right" id="btn-right">✓ Right<kbd>Y</kbd></button>
    <input id="note" type="text" placeholder="Optional: what is wrong (e.g. 'col 3 name should be Body length')" aria-label="Note">
    <button class="ghost" id="next" title="Next table (→)">→</button>
    <button class="ghost" id="next-open">Next unchecked</button>
    <select id="show" aria-label="Which tables to show" hidden>
      <option value="all">All tables</option>
      <option value="focus">Changed, or wrong last round</option>
    </select>
    <select id="jump" aria-label="Jump to a table"></select>
    <div class="status" id="status"></div>
  </footer>
</div>

<script>
(function () {
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const CONFIG = JSON.parse(document.getElementById("config").textContent);
  let order = DATA.map((_t, i) => i);   // the tables shown, in order
  const ROLE_NAMES = { title: "title", group: "group", column: "column name", specification: "specification",
    joined: "joined (spec + name)", row_label: "row label", value: "value", footnote: "footnote",
    section: "section", none: "no role given", pre: "above the header", data: "body (data)" };
  const reviews = {};            // id -> {verdict, note}
  let idx = 0, db = null, firstSnap = true, touched = false;
  const $ = (id) => document.getElementById(id);

  function esc(s) { return String(s).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch])); }

  function render() {
    const t = DATA[idx];
    if (!t) return;
    $("where").innerHTML = `<b>${esc(t.paper)}</b> · table ${t.table} · ${t.nrows}×${t.ncols} · <span style="color:var(--muted)">${order.indexOf(idx) + 1} of ${order.length}</span>`;
    const rv = reviews[t.id];
    $("verdict").innerHTML = (rv ? `<span class="pill ${rv.verdict}">${rv.verdict === "right" ? "✓ marked right" : "✗ marked wrong"}</span> ` : "")
      + (t.changed ? `<span class="pill changed">reading changed</span> ` : "")
      + (t.dev ? `<span class="pill dev">used in development</span>` : "");
    const pr = t.prev;
    $("prev-round").hidden = !pr;
    if (pr) $("prev-round").innerHTML = `Round ${CONFIG.round - 1}: <b class="${pr.verdict}">${pr.verdict === "right" ? "✓ right" : "✗ wrong"}</b>`
      + (pr.note ? ` — ${esc(pr.note)}` : "");
    $("sections").hidden = !(t.sections && t.sections.length);
    if (t.sections && t.sections.length) $("sections").innerHTML = `<b>Sections:</b> ${t.sections.map(esc).join(" · ")}`;
    // grid
    const used = new Set();
    let html = "";
    t.rows.forEach((row, r) => {
      const body = r >= t.start;
      html += `<tr class="${r === t.start ? "first-body" : ""}"><th>${r === t.start ? "body ▸ " : ""}${r}</th>`;
      row.forEach((c) => {
        used.add(c.role);
        html += `<td class="role-${c.role}"${c.rs > 1 ? ` rowspan="${c.rs}"` : ""}${c.cs > 1 ? ` colspan="${c.cs}"` : ""} title="${esc(ROLE_NAMES[c.role] || c.role)}">${esc(c.t)}</td>`;
      });
      html += "</tr>";
    });
    $("grid").innerHTML = html;
    $("legend").innerHTML = Object.keys(ROLE_NAMES).filter((k) => used.has(k))
      .map((k) => `<span><i class="role-${k}"></i>${ROLE_NAMES[k]}</span>`).join("");
    // reading
    $("cols").innerHTML = t.cols.map((c) => `<tr><td class="n">${c.col}</td>`
      + `<td class="g">${c.groups.length ? esc(c.groups.join(" › ")) + " ›" : ""}</td>`
      + `<td class="nm">${c.name ? esc(c.name) : '<span class="missing">no name</span>'}</td>`
      + `<td class="d">${c.details.length ? esc(c.details.join(" · ")) : ""}</td></tr>`).join("")
      || `<tr><td class="missing">The reader produced no columns for this table.</td></tr>`;
    $("note").value = rv && rv.note ? rv.note : "";
    $("jump").value = String(idx);
    progress();
  }

  function progress() {
    const shown = order.map((i) => DATA[i]);
    const done = shown.filter((t) => reviews[t.id]).length;
    const wrong = shown.filter((t) => reviews[t.id] && reviews[t.id].verdict === "wrong").length;
    $("progress").textContent = `${done} of ${shown.length} checked · ${done - wrong} right · ${wrong} wrong`;
    $("fill").style.width = `${shown.length ? (100 * done) / shown.length : 0}%`;
  }

  function nextOpen(from) {
    const pos = order.indexOf(from);
    for (let k = 1; k <= order.length; k++) {
      const j = order[(pos + k + order.length) % order.length];
      if (!reviews[DATA[j].id]) return j;
    }
    return -1;
  }

  function step(d) { const j = order[order.indexOf(idx) + d]; if (j !== undefined) go(j); }
  function go(j) { if (j >= 0 && j < DATA.length) { idx = j; touched = true; render(); } }
  function setOrder(mode) {
    order = DATA.map((_t, i) => i).filter((i) => mode === "all" || DATA[i].changed
      || (DATA[i].prev && DATA[i].prev.verdict === "wrong"));
    if (!order.length) order = DATA.map((_t, i) => i);
    $("jump").innerHTML = order.map((i) => `<option value="${i}">${esc(DATA[i].paper)} · table ${DATA[i].table}</option>`).join("");
    if (!order.includes(idx)) idx = order[0];
    render();
  }

  async function mark(verdict) {
    const t = DATA[idx];
    const note = $("note").value.trim();
    reviews[t.id] = { verdict, note };
    progress();
    const at = idx;
    const nxt = nextOpen(idx);
    if (nxt >= 0) go(nxt); else render();
    if (!db) { status("Not saved: this view has no storage. Open the page on claude.ai while signed in.", true); return; }
    try {
      await db.collection(CONFIG.collection).doc(t.id).set({ paper: t.paper, table: t.table, verdict, note, at: Date.now() });
      status(`Saved ${t.paper} table ${t.table} as ${verdict}.`);
    } catch (e) {
      status(`Could not save ${t.paper} table ${t.table} (${e && e.code ? e.code : "error"}). Go back with ← and mark it again.`, true);
      delete reviews[t.id];
      progress();
    }
  }

  function status(msg, err) { const s = $("status"); s.textContent = msg; s.className = "status" + (err ? " err" : ""); }

  // jump list
  $("jump").innerHTML = order.map((i) => `<option value="${i}">${esc(DATA[i].paper)} · table ${DATA[i].table}</option>`).join("");
  if (DATA.some((t) => t.prev)) { $("show").hidden = false; $("show").addEventListener("change", (e) => setOrder(e.target.value)); }
  $("jump").addEventListener("change", (e) => go(Number(e.target.value)));
  $("prev").addEventListener("click", () => step(-1));
  $("next").addEventListener("click", () => step(1));
  $("next-open").addEventListener("click", () => { const j = nextOpen(idx); if (j >= 0) go(j); else status("Every table is checked."); });
  $("btn-right").addEventListener("click", () => mark("right"));
  $("btn-wrong").addEventListener("click", () => mark("wrong"));
  document.addEventListener("keydown", (e) => {
    if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "SELECT")) {
      if (e.key === "Escape") e.target.blur();
      return;
    }
    if (e.key === "y" || e.key === "Y") mark("right");
    else if (e.key === "n" || e.key === "N") mark("wrong");
    else if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "ArrowRight") step(1);
  });

  render();

  (async () => {
    try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
    if (!db) { $("progress").textContent = "answers can't be saved in this view"; status("Open this page on claude.ai while signed in to save answers.", true); return; }
    db.collection(CONFIG.collection).onSnapshot((snap) => {
      for (const k of Object.keys(reviews)) delete reviews[k];
      snap.docs.forEach((d) => { const v = d.data(); if (v) reviews[d.id] = { verdict: v.verdict, note: v.note || "" }; });
      if (firstSnap) {
        firstSnap = false;
        if (!touched) { const first = order[0]; const j = reviews[DATA[first].id] ? nextOpen(first) : first; if (j >= 0) idx = j; }
      }
      render();
    }, (e) => status(`Lost the connection to saved answers (${e.code}). Reload the page.`, true));
  })();
})();
</script>
